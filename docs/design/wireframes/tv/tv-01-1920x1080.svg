<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" aria-labelledby="title desc" role="img" viewBox="0 0 1920 1080"><title id="title">TV-01 Pi TV wireframe</title><desc id="desc">Proposed design, illustrative only.</desc><rect width="1920" height="1080" fill="#11131A"/><text x="100" y="106" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="48" font-weight="700">Pi TV</text><text x="100" y="1017" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="22" font-weight="400">↑ ↓ ← → Navigate • OK Select • Back Return</text><text x="100" y="152" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="34" font-weight="700">Welcome to Pi TV</text><text x="100" y="194" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="28" font-weight="400">Set up this device using an approved local method.</text><text x="100" y="230" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="22" font-weight="400">Local setup is available only after its security path is approved.</text><rect width="1720" height="150" x="100" y="262" fill="#202630" stroke="#687586" stroke-width="1" rx="12"/><text x="124" y="307" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="28" font-weight="700">Local setup unavailable?</text><text x="124" y="342" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="22" font-weight="400">Open help for recovery guidance. A phone cannot approve setup.</text><rect width="240" height="68" x="100" y="452" fill="#2A3443" stroke="#9ED0FF" stroke-width="4" rx="12"/><text x="120" y="496" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="28" font-weight="700">Open help</text><rect width="260" height="68" x="364" y="452" fill="#202630" stroke="#687586" stroke-width="1" rx="12"/><text x="384" y="496" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="28" font-weight="700">Begin setup</text><text x="364" y="552" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="22" font-weight="400">Requires approved local method</text></svg>