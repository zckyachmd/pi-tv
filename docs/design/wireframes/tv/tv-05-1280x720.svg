<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">TV-05 Pi TV wireframe</title><desc id="desc">Proposed design, illustrative only.</desc>
<rect width="1280" height="720" fill="#11131A"/>
<text x="68" y="76" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="36" font-weight="700">Pi TV</text>
<text x="68" y="675" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="18" font-weight="400">↑ ↓ ← → Navigate    •    OK Select    •    Back Return</text>
<rect x="190" y="129" width="900" height="365" rx="12" fill="#2A3443" stroke="#687586" stroke-width="1"/>
<text x="222" y="184" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="28" font-weight="700">Confirm enrollment</text>
<text x="222" y="229" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="22" font-weight="400">A controller is awaiting a local decision.</text>
<text x="222" y="269" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="18" font-weight="400">Verify the request using the approved local path.</text>
<text x="222" y="304" fill="#FFD18A" font-family="Arial, sans-serif" font-size="18" font-weight="400">No approved path? Reject and use recovery guidance.</text>
<rect x="222" y="354" width="180" height="56" rx="12" fill="#2A3443" stroke="#9ED0FF" stroke-width="3"/>
<text x="242" y="390" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="22" font-weight="700">Reject</text>
<rect x="425" y="354" width="220" height="56" rx="12" fill="#202630" stroke="#687586" stroke-width="1"/>
<text x="445" y="390" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="22" font-weight="700">Approve</text>
<text x="222" y="449" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="18" font-weight="400">Approval stays disabled until the local method is approved.</text>
</svg>
