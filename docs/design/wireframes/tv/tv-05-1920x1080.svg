<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">TV-05 Pi TV wireframe</title><desc id="desc">Proposed design, illustrative only.</desc>
<rect width="1920" height="1080" fill="#11131A"/>
<text x="100" y="106" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="48" font-weight="700">Pi TV</text>
<text x="100" y="1017" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="22" font-weight="400">↑ ↓ ← → Navigate    •    OK Select    •    Back Return</text>
<rect x="460" y="167" width="1000" height="450" rx="12" fill="#2A3443" stroke="#687586" stroke-width="1"/>
<text x="492" y="222" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="34" font-weight="700">Confirm enrollment</text>
<text x="492" y="267" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="28" font-weight="400">A controller is awaiting a local decision.</text>
<text x="492" y="307" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="22" font-weight="400">Verify the request using the approved local path.</text>
<text x="492" y="342" fill="#FFD18A" font-family="Arial, sans-serif" font-size="22" font-weight="400">No approved path? Reject and use recovery guidance.</text>
<rect x="492" y="392" width="180" height="68" rx="12" fill="#2A3443" stroke="#9ED0FF" stroke-width="4"/>
<text x="512" y="436" fill="#F4F5F7" font-family="Arial, sans-serif" font-size="28" font-weight="700">Reject</text>
<rect x="695" y="392" width="220" height="68" rx="12" fill="#202630" stroke="#687586" stroke-width="1"/>
<text x="715" y="436" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="28" font-weight="700">Approve</text>
<text x="492" y="487" fill="#B3BDCA" font-family="Arial, sans-serif" font-size="22" font-weight="400">Approval stays disabled until the local method is approved.</text>
</svg>
