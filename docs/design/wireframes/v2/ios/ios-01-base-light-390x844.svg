<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" aria-labelledby="title desc" role="img" viewBox="0 0 390 844"><title id="title">IOS-01 base</title><desc id="desc">Static design proposal, sample data, not functional.</desc><rect width="390" height="844" x="0" y="0" fill="#F4F6F9" rx="0"/><text x="24" y="34" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="366" y="34" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="end">Bluetooth</text><path fill="none" stroke="#64748B" stroke-linecap="round" stroke-width="1" d="M24 48L366 48"/><text x="24" y="88" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Welcome to Pi TV</text><text x="24" y="118" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Your iPhone is the remote. No shared</text><text x="24" y="142" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Wi-Fi required.</text><path fill="none" stroke="#174A82" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M11 2V22L18 16L6 6 M11 2L18 8L6 18" transform="translate(157.0 200) scale(3.1666666666666665)"/><rect width="342" height="86" x="24" y="310" fill="#FFF" rx="12"/><path fill="none" stroke="#174A82" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M11 2V22L18 16L6 6 M11 2L18 8L6 18" transform="translate(38 332) scale(1.3333333333333333)"/><text x="82" y="340" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start">Bluetooth access</text><text x="82" y="364" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Discover and control your Pi TV.</text><rect width="342" height="86" x="24" y="408" fill="#FFF" rx="12"/><path fill="none" stroke="#174A82" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M3 3H9V9H3Z M15 3H21V9H15Z M3 15H9V21H3Z M15 15H21V21 M12 3V7 M12 12H16 M18 12H21" transform="translate(38 430) scale(1.3333333333333333)"/><text x="82" y="438" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start">Camera access</text><text x="82" y="462" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Scan the code on your TV.</text><rect width="342" height="52" x="24" y="518" fill="#174A82" rx="12"/><text x="195" y="549.78" fill="#FFF" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Continue</text><text x="24" y="594" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">You can change permissions in Settings.</text></svg>