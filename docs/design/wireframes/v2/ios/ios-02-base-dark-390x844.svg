<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" aria-labelledby="title desc" role="img" viewBox="0 0 390 844"><title id="title">IOS-02 base</title><desc id="desc">Static design proposal, sample data, not functional.</desc><rect width="390" height="844" x="0" y="0" fill="#11131A" rx="0"/><text x="24" y="34" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="366" y="34" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="end">Bluetooth</text><path fill="none" stroke="#687586" stroke-linecap="round" stroke-width="1" d="M24 48L366 48"/><text x="24" y="88" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Find your TV</text><text x="24" y="118" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Choose a nearby device or scan its</text><text x="24" y="142" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">on-screen code.</text><rect width="342" height="86" x="24" y="188" fill="#202630" rx="12"/><path fill="none" stroke="#9ED0FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M2 3H22V17H2Z M8 21H16 M12 17V21" transform="translate(38 210) scale(1.3333333333333333)"/><text x="82" y="218" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start">Pi TV • nearby</text><text x="82" y="242" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Discovery hint only; identity not</text><text x="82" y="259" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">verified.</text><rect width="342" height="52" x="24" y="300" fill="#9ED0FF" rx="12"/><text x="195" y="331.78" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Scan TV code</text><rect width="342" height="52" x="24" y="364" fill="#2A3443" rx="12"/><text x="195" y="395.78" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Search again</text><text x="24" y="436" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Keep Bluetooth on and stay near your TV.</text></svg>