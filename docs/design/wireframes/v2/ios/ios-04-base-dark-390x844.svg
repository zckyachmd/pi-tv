<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" aria-labelledby="title desc" role="img" viewBox="0 0 390 844"><title id="title">IOS-04 base</title><desc id="desc">Static design proposal, sample data, not functional.</desc><rect width="390" height="844" x="0" y="0" fill="#11131A" rx="0"/><text x="24" y="34" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="366" y="34" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="end">Bluetooth</text><path fill="none" stroke="#687586" stroke-linecap="round" stroke-width="1" d="M24 48L366 48"/><text x="24" y="88" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Verify your TV</text><text x="24" y="118" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Check that the phrase matches your TV</text><text x="24" y="142" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">screen.</text><rect width="342" height="132" x="24" y="186" fill="#202630" rx="18"/><path fill="none" stroke="#9ED0FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M12 2L21 6V12Q21 18 12 22Q3 18 3 12V6Z M8 12L11 15L17 9" transform="translate(42 208) scale(1.5)"/><text x="88" y="221" fill="#9ED0FF" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">RIVER · MAPLE · SKY</text><text x="42" y="260" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Illustrative phrase, not a real pairing</text><text x="42" y="280" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">secret.</text><rect width="342" height="52" x="24" y="344" fill="#9ED0FF" rx="12"/><text x="195" y="375.78" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Phrase matches</text><rect width="342" height="52" x="24" y="408" fill="#2A3443" rx="12"/><text x="195" y="439.78" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Cancel pairing</text><text x="24" y="480" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Only confirm if you can see the matching phrase</text><text x="24" y="500" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">on your TV.</text></svg>