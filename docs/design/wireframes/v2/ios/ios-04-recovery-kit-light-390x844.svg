<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" aria-labelledby="title desc" role="img" viewBox="0 0 390 844"><title id="title">IOS-04 recovery-kit</title><desc id="desc">Static design proposal, sample data, not functional.</desc><rect width="390" height="844" x="0" y="0" fill="#F4F6F9" rx="0"/><text x="24" y="34" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="366" y="34" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="end">Bluetooth</text><path fill="none" stroke="#64748B" stroke-linecap="round" stroke-width="1" d="M24 48L366 48"/><text x="24" y="88" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Save recovery kit</text><text x="24" y="118" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Your TV is paired. Save a backup before</text><text x="24" y="142" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">using your remote.</text><rect width="342" height="86" x="24" y="190" fill="#FFF" rx="12"/><path fill="none" stroke="#174A82" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M6 10H18V22H6Z M8 10V6Q8 2 12 2Q16 2 16 6V10" transform="translate(38 212) scale(1.3333333333333333)"/><text x="82" y="220" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start">Recovery kit</text><text x="82" y="244" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Keep it somewhere you can access if</text><text x="82" y="261" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">this iPhone is lost.</text><rect width="342" height="52" x="24" y="300" fill="#174A82" rx="12"/><text x="195" y="331.78" fill="#FFF" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Save recovery kit</text><rect width="342" height="52" x="24" y="364" fill="#E4E9F0" rx="12"/><text x="195" y="395.78" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle">I have saved it</text><text x="24" y="438" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Illustration only. Never share the recovery</text><text x="24" y="458" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">credential.</text><text x="24" y="502" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Backup and storage choices require security</text><text x="24" y="522" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">review.</text></svg>