<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">TV-04 expired</title><desc id="desc">Static design proposal, sample data, not functional.</desc>
