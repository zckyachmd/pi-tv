<text x="530" y="321" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#9ED0FF" text-anchor="middle">1</text>
<text x="564" y="321" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#F4F5F7" text-anchor="start">This code is no longer valid.</text>
