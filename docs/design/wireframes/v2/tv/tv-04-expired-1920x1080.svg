<text x="564" y="437" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#F4F5F7" text-anchor="start">A fresh code requires authorized renewal.</text>
<text x="512" y="498" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#FFD18A" text-anchor="start">An owned device never becomes open for enrollment just because a code expires.</text>
