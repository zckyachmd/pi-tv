<text x="530" y="379" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#9ED0FF" text-anchor="middle">2</text>
<text x="564" y="379" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#F4F5F7" text-anchor="start">Follow the recovery instructions in the app.</text>
