<path transform="translate(112 233) scale(3.0)" d="M12 2L21 6V12Q21 18 12 22Q3 18 3 12V6Z M8 12L11 15L17 9" fill="none" stroke="#9ED0FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="216" y="249" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#F4F5F7" text-anchor="start">Compare the verification phrase</text>
<text x="216" y="300" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#9ED0FF" text-anchor="start">RIVER  •  MAPLE  •  SKY</text>
<text x="216" y="352" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#B3BDCA" text-anchor="start">If the phrase matches the one in the app, confirm there. Otherwise cancel in the app.</text>
