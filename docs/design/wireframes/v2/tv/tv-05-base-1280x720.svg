<text x="76" y="80" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#F4F5F7" text-anchor="start">Pi TV</text>
<path d="M76 102L1204 102" fill="none" stroke="#687586" stroke-width="1" stroke-linecap="round"/>
<text x="1204" y="77" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFD18A" text-anchor="end">SETUP MODE</text>
<text x="76" y="664" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#B3BDCA" text-anchor="start">Use Pi TV Remote on your iPhone</text>
<text x="1204" y="664" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#B3BDCA" text-anchor="end">Pi TV  /  Setup</text>
<text x="76" y="140" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#F4F5F7" text-anchor="start">Verify your TV</text>
<text x="76" y="173" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#B3BDCA" text-anchor="start">Finish enrollment on your iPhone, not on this screen.</text>
