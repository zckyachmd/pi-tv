<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" aria-labelledby="title desc" role="img" viewBox="0 0 1920 1080"><title id="title">TV-05 base</title><desc id="desc">Static design proposal, sample data, not functional.</desc><rect width="1920" height="1080" x="0" y="0" fill="#11131A" rx="0"/><text x="108" y="114" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="700" text-anchor="start">Pi TV</text><path fill="none" stroke="#687586" stroke-linecap="round" stroke-width="1" d="M108 136L1812 136"/><text x="1812" y="111" fill="#FFD18A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="end">SETUP MODE</text><text x="108" y="1006" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">Use Pi TV Remote on your iPhone</text><text x="1812" y="1006" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="end">Pi TV / Setup</text><text x="108" y="174" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start">Verify your TV</text><text x="108" y="214" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start">Finish enrollment on your iPhone, not on this screen.</text><rect width="1704" height="410" x="108" y="246" fill="#202630" rx="18"/><path fill="none" stroke="#9ED0FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M12 2L21 6V12Q21 18 12 22Q3 18 3 12V6Z M8 12L11 15L17 9" transform="translate(144 282) scale(4.5)"/><text x="288" y="298" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start">Compare the verification phrase</text><text x="288" y="349" fill="#9ED0FF" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start">RIVER • MAPLE • SKY</text><text x="288" y="401" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start">If the phrase matches the one in the app, confirm there. Otherwise cancel in the app.</text><text x="288" y="443" fill="#FFD18A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">If the phrase differs, cancel and do not continue.</text></svg>