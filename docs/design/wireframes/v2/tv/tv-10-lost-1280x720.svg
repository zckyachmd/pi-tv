<text x="1204" y="77" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#FFD18A" text-anchor="end">SETUP MODE</text>
<text x="76" y="664" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#B3BDCA" text-anchor="start">Use Pi TV Remote on your iPhone</text>
<text x="1204" y="664" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#B3BDCA" text-anchor="end">Pi TV  /  Setup</text>
<text x="76" y="140" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#F4F5F7" text-anchor="start">Recover your remote</text>
