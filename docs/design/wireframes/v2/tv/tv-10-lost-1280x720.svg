<text x="206" y="243" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#F4F5F7" text-anchor="start">Open Pi TV Remote on your replacement iPhone. Choose Recover device and use your saved</text>
<text x="206" y="271" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#F4F5F7" text-anchor="start">recovery kit.</text>
<text x="206" y="317" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#FFD18A" text-anchor="start">If all credentials are lost, secure re-provisioning is required. No automatic reset.</text>
