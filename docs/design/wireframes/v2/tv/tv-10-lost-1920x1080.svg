<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" aria-labelledby="title desc" role="img" viewBox="0 0 1920 1080"><title id="title">TV-10 lost</title><desc id="desc">Static design proposal, sample data, not functional.</desc><rect width="1920" height="1080" x="0" y="0" fill="#11131A" rx="0"/><text x="108" y="114" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="700" text-anchor="start">Pi TV</text><path fill="none" stroke="#687586" stroke-linecap="round" stroke-width="1" d="M108 136L1812 136"/><text x="1812" y="111" fill="#FFD18A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="end">SETUP MODE</text><text x="108" y="1006" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">Use Pi TV Remote on your iPhone</text><text x="1812" y="1006" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="end">Pi TV / Setup</text><text x="108" y="174" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start">Recover your remote</text><text x="108" y="214" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start">You do not need a keyboard or a mouse.</text><rect width="1704" height="340" x="108" y="246" fill="#202630" rx="18"/><path fill="none" stroke="#9ED0FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M6 10H18V22H6Z M8 10V6Q8 2 12 2Q16 2 16 6V10" transform="translate(140 278) scale(3.75)"/><text x="268" y="292" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start">Open Pi TV Remote on your replacement iPhone. Choose Recover device and use your saved recovery kit.</text><text x="268" y="344" fill="#FFD18A" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start">If all credentials are lost, secure re-provisioning is required. No automatic reset.</text><text x="268" y="392" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">No screen interaction is required for this recovery proposal.</text></svg>