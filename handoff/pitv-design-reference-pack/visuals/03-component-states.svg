u Sans, sans-serif" font-size="23" font-weight="700" fill="#F4F5F7" text-anchor="start">Disconnected</text><text x="112" y="924" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#B3BDCA" text-anchor="start">Reconnect to restore current state</text><rect x="810" y="856" width="720" height="90" rx="12" fill="#202630" stroke="#687586" stroke-width="1"/><circle cx="842" cy="888" r="7" fill="#FFD18A" stroke="none" stroke-width="1"/><text x="862" y="894" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#F4F5F7" text-anchor="start">Outcome unknown</text><text x="862" y="924" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#B3BDCA" text-anchor="start">Refresh state; do not replay automatically</text><text x="60" y="1003" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#B3BDCA" text-anchor="start">Transport connected ≠ authenticated • Accepted ≠ applied • Applied ≠ verified provider playback</text></svg>