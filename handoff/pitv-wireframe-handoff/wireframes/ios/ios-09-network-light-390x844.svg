<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" aria-labelledby="title desc" role="img" viewBox="0 0 390 844"><title id="title">IOS-09 network</title><desc id="desc">Static design proposal, sample data, not functional.</desc><rect width="390" height="844" x="0" y="0" fill="#F4F6F9" rx="0"/><text x="24" y="34" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="start">9:41</text><text x="366" y="34" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="end">Bluetooth</text><path fill="none" stroke="#64748B" stroke-linecap="round" stroke-width="1" d="M24 48L366 48"/><text x="24" y="88" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="start">Internet setup</text><text x="24" y="118" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Only the Pi needs internet for</text><text x="24" y="142" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">streaming. Your remote stays on</text><text x="24" y="166" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Bluetooth.</text><rect width="342" height="86" x="24" y="202" fill="#FFF" rx="12"/><path fill="none" stroke="#174A82" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M2 8Q12 0 22 8 M5 12Q12 6 19 12 M8 16Q12 12 16 16 M12 20H12.1" transform="translate(38 224) scale(1.3333333333333333)"/><text x="82" y="232" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start">Home network</text><text x="82" y="256" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Example network • secured</text><rect width="342" height="58" x="24" y="300" fill="#FFF" rx="12"/><text x="38" y="336" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Enter Wi-Fi password</text><rect width="342" height="52" x="24" y="372" fill="#174A82" rx="12"/><text x="195" y="403.78" fill="#FFF" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Connect Pi TV</text><rect width="342" height="52" x="24" y="436" fill="#E4E9F0" rx="12"/><text x="195" y="467.78" fill="#11131A" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Skip for now</text><text x="24" y="508" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Send settings only through the authenticated</text><text x="24" y="528" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">session. Existing host settings are protected.</text><path fill="none" stroke="#64748B" stroke-linecap="round" stroke-width="1" d="M24 760L366 760"/><text x="56" y="793" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Remote</text><text x="195" y="793" fill="#174A82" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Devices</text><text x="334" y="793" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Help</text></svg>