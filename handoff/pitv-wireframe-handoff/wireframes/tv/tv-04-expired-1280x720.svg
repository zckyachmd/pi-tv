<text x="382" y="376" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#9ED0FF" text-anchor="middle">3</text>
<text x="416" y="376" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#F4F5F7" text-anchor="start">A fresh code requires authorized renewal.</text>
<text x="364" y="431" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#FFD18A" text-anchor="start">An owned device never becomes open for enrollment just because a code expires.</text>
