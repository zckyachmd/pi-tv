<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1280 720"><title id="title">TV-05 base</title><desc id="desc">Static design proposal, sample data, not functional.</desc><rect width="1280" height="720" x="0" y="0" fill="#11131A" rx="0"/><text x="76" y="80" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start">Pi TV</text><path fill="none" stroke="#687586" stroke-linecap="round" stroke-width="1" d="M76 102L1204 102"/><text x="1204" y="77" fill="#FFD18A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="end">SETUP MODE</text><text x="76" y="664" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Use Pi TV Remote on your iPhone</text><text x="1204" y="664" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="end">Pi TV / Setup</text><text x="76" y="140" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="start">Verify your TV</text><text x="76" y="173" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">Finish enrollment on your iPhone, not on this screen.</text><rect width="1128" height="280" x="76" y="197" fill="#202630" rx="18"/><path fill="none" stroke="#9ED0FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M12 2L21 6V12Q21 18 12 22Q3 18 3 12V6Z M8 12L11 15L17 9" transform="translate(112 233) scale(3.0)"/><text x="216" y="249" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="start">Compare the verification phrase</text><text x="216" y="300" fill="#9ED0FF" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="start">RIVER • MAPLE • SKY</text><text x="216" y="352" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">If the phrase matches the one in the app, confirm there. Otherwise cancel in the app.</text><text x="216" y="388" fill="#FFD18A" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">If the phrase differs, cancel and do not continue.</text></svg>