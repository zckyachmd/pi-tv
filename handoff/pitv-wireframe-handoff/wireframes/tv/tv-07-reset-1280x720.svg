<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1280 720"><title id="title">TV-07 reset</title><desc id="desc">Static design proposal, sample data, not functional.</desc><rect width="1280" height="720" x="0" y="0" fill="#11131A" rx="0"/><text x="76" y="80" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start">Pi TV</text><path fill="none" stroke="#687586" stroke-linecap="round" stroke-width="1" d="M76 102L1204 102"/><text x="1204" y="77" fill="#86E0AA" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="end">REMOTE READY</text><text x="76" y="664" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">D-pad • Select • Back • Home</text><text x="1204" y="664" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="end">Pi TV / Local control</text><text x="76" y="140" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="start">Settings</text><text x="76" y="173" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">Manage your appliance from Pi TV Remote.</text><rect width="1128" height="66" x="76" y="197" fill="#202630" rx="12"/><path fill="none" stroke="#9ED0FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M6 10H18V22H6Z M8 10V6Q8 2 12 2Q16 2 16 6V10" transform="translate(92 213) scale(1.3333333333333333)"/><text x="142" y="224" fill="#F4F5F7" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start">Reset remote access</text><text x="142" y="245" fill="#B3BDCA" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">Revoke controllers and rotate identity</text><rect width="1128" height="66" x="76" y="275" fill="#202630" rx="12"/><path